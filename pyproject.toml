[project]
name = "arb-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "connectcomputers", email = "connectcomputersoke@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
    "eth-account>=0.13.7",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "py>=1.11.0",
    "py-clob-client-v2>=1.1.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.52.1",
    "web3>=7.16.0",
]

[project.scripts]
arb-bot = "arb_bot:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
