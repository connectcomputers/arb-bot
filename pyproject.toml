[project]
name = "arb-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "connectcomputers", email = "connectcomputersoke@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "py>=1.11.0",
    "pydantic>=2.13.4",
]

[project.scripts]
arb-bot = "arb_bot:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
