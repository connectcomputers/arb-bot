<script>
document.addEventListener('DOMContentLoaded', function(){
  var st=document.createElement('style'); st.textContent='@keyframes lspin{to{transform:rotate(360deg)}}'; document.head.appendChild(st);
  var bar=document.createElement('div'); bar.id='live-indicator';
  bar.style.cssText='position:fixed;right:12px;bottom:12px;z-index:999;background:#052e16;border:1px solid #16a34a;color:#86efac;border-radius:8px;padding:8px 12px;font:12px monospace;display:flex;gap:8px;align-items:center';
  bar.innerHTML='<span id="li-spin" style="width:12px;height:12px;border:2px solid #22c55e;border-top-color:transparent;border-radius:50%;animation:lspin 1s linear infinite"></span><span id="li-text">SCANNER MENYALA…</span>';
  document.body.appendChild(bar);
  var SCAN=30, epoch=0, cycles=0;
  function findEpoch(o){ if(!o||typeof o!=='object')return null; if(typeof o.epoch==='number')return o.epoch; for(var k in o){var v=findEpoch(o[k]); if(v)return v;} return null; }
  function pull(){ fetch('/api/engine/status').then(function(r){return r.json();}).then(function(d){ var e=findEpoch(d); if(e&&e!==epoch){epoch=e;cycles++;} else if(e){epoch=e;} }).catch(function(){}); }
  setInterval(pull,5000); pull();
  function msg(){
    var clock=new Date().toLocaleTimeString('id-ID');
    if(!epoch) return '🟢 SCANNER MENYALA · '+clock;
    var age=Math.floor(Date.now()/1000)-epoch;
    if(age>SCAN+45) return '⚠ SCAN LAMBAT '+age+'s · '+clock;
    if(age>SCAN) return '🟢 SCAN BERJALAN · siklus #'+cycles+' · '+clock;
    return '🟢 SCAN #'+cycles+' · berikut '+(SCAN-age)+'s · '+clock;
  }
  function broadcast(){
    var m=msg();
    var tx=document.getElementById('li-text'); if(tx) tx.textContent=m;
    var sp=document.getElementById('li-spin');
    if(sp){ var slow=(m.indexOf('⚠')===0); sp.style.borderColor= slow?'#ef4444':'#22c55e'; sp.style.borderTopColor='transparent'; }
    if(!document.body) return;
    var w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
    var n, tg=[];
    while((n=w.nextNode())){ var v=n.nodeValue||''; if(/dtk lalu|SCAN BERJALAN|SCAN #|hasil menyusul|SCANNER MENYALA/.test(v)) tg.push(n); }
    for(var i=0;i<tg.length;i++){ tg[i].nodeValue=m; }
  }
  setInterval(broadcast,250); broadcast();
});
</script>

<script>
(function(){
  function alive(){
    var now = new Date();
    var stamp = now.toLocaleTimeString('id-ID');
    var sec = now.getSeconds();
    var nodes = document.querySelectorAll('div,span,small');
    for (var i=0;i<nodes.length;i++){
      var el = nodes[i];
      if (el.children.length) continue;
      var tx = el.textContent || '';
      if (/memindai ulang|hasil menyusul|memindai… detik|screening aktif/.test(tx)){
        el.textContent = '⏳ screening aktif · detik ke-' + sec + ' · ' + stamp;
      }
    }
  }
  setInterval(alive, 1000);
  setTimeout(alive, 400);
})();
</script>

async function micro(v){
  if(!confirm('Eksekusi REAL mikro di '+v.toUpperCase()+
              ' (± sesuai Modal per OP)?')) return;
  const r = await fetch('/api/exec/micro',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({venue:v})});
  const d = await r.json();
  let msg = (d.ok?'✅ ':'❌ ')+d.message;

  if(!d.ok && v==='polymarket' &&
     (d.message.includes('geofence') || d.message.includes('403'))){
    msg = '❌ GEOFENCE / GEOBLOCK\n\n' +
      'Penggunaan Polymarket di USA terdampak "⚠️ Geoblock (paper trading)", ' +
      'perlu 🔧 proxy wilayah didukung (opsional → residential proxy URL: ' +
      'http://user:pass@host:port wilayah didukung) agar aplikasi bot ini ' +
      'bisa meng-eksekusi order real.\n\n' +
      'Isi di /setup → field "Proxy URL eksekusi". Bila dikosongkan, ' +
      'Polymarket tetap scanner + paper trading.';
  }

  if(!d.ok && v==='limitless' &&
     (d.message.includes('smart_wallet_profile_id') || d.message.includes('numeric'))){
    msg = '❌ WALLET MODE ERROR\n\n' +
      'Karena pilihan "Wallet Limitless" di halaman setup, dibutuhkan scope ' +
      '(Delegated Signing) agar bot bisa tanda tangan ATAS NAMA wallet web ' +
      '(tanpa private key) — scope ini hanya untuk partner accounts.\n\n' +
      'ATAU ubah pilihan wallet menjadi "Wallet Pribadi (EOA)" dan masukkan ' +
      'Private Key Wallet Pribadi (0x + 64 hex) pada field yang tersedia ' +
      '(saldo 9.83 USDC di-Withdraw sekali ke alamat EOA tersebut).';
  }

  if(!d.ok && v==='kalshi' &&
     (d.message.includes('shard') || d.message.includes('user_not_found'))){
    msg = '❌ KALSHI EXCHANGE SHARDING\n\n' +
      'Kalshi kini memecah trading ke beberapa shard: dana akun di shard 0, ' +
      'sedangkan market target di shard lain → order ditolak sampai kolateral ' +
      'dialokasikan ke shard market.\n\n' +
      'Perbaikan aktif: bot memilih market shard 0 + auto-transfer kolateral ' +
      'bila ticker manual beda shard. Coba lagi tombol 🎯.';
  }

  if(!d.ok && d.message.includes('cap harian')){
    msg = '❌ CAP HARIAN TERCAPAI (guardrail risiko)\n\n' +
      'Order REAL dihentikan untuk SEMUA venue — ini bukan error venue.\n\n' +
      'Status masing-masing venue bila cap dibuka:\n' +
      '• KALSHI: ✅ siap (sharding + auto-transfer terbukti)\n' +
      '• POLYMARKET: ⚠️ geoblock USA — perlu proxy wilayah didukung\n' +
      '• LIMITLESS: ⚠️ butuh scope Delegated Signing / mode EOA\n\n' +
      'Naikkan batas di /limits, reset counter (mode tes), atau tunggu besok.';
  }
    
  alert(msg);
  poll();
}

async function poll_alerts(){
  fetch('/api/alerts').then(r=>r.json()).then(d=>{
    const alerts = d.alerts || [];
    const banner = document.getElementById('alert-banner');
    const msg = document.getElementById('alert-message');
    if (alerts.length > 0) {
      banner.style.display = 'block';
      msg.textContent = alerts.map(a=>a.message).join(' | ');
    } else {
      banner.style.display = 'none';
    }
  }).catch(()=>{});
}

async function poll(){
  const [f, s] = await Promise.all([
    fetch('/api/venue-feed').then(r=>r.json()),
    fetch('/api/engine/status').then(r=>r.json())]);
  window.__st = s;
  if (s.kill || s.need_rearm){ location.href = '/setup'; return; }   // ← TAMBAH INI
  const ep0 = ((s.info||{}).epoch) || 0;
  const age0 = Math.floor(Date.now()/1000) - ep0;
  if (age0 > (s.interval||30) * 2 && !window.__rf) {
    window.__rf = true;
    fetch('/api/engine/refresh', {method:'POST'})
      .then(()=>{ window.__rf = false; poll(); });
  }  
  const b = document.getElementById('badge');
  b.textContent = s.kill ? '🛑 KILLED' : (s.running ? 'ACTIVE · '+s.mode.toUpperCase() : 'INACTIVE');
  b.className = 'badge ' + (s.running && !s.kill ? 'on' : 'off');
  if (s.auto_stop){ b.textContent = 'AUTO-STOP'; b.className = 'badge off'; }  
  document.getElementById('cols').innerHTML = f.venues.map(v => `
  <div class="col">
    <h2>${v.venue.toUpperCase()} ${v.valid?'✅':'⚠️'} ·
      <a target="_blank" href="${LINKS[v.venue]}">buka exchange ↗</a>
      <button class="blue" onclick="micro('${v.venue}')">🎯</button>
    </h2>
    <div class="muted">Menu: ${(v.cats||[]).join(', ')||'-'}</div>
    <h4>Open Positions (OP)</h4><div style="font-size:10px;color:#64748b;margin-bottom:4px">posisi terisi; order GTC menunggu fill tercatat di Rekonsiliasi</div>
    ${v.positions.filter(p=>(p.value||0)>0).length ? v.positions.filter(p=>(p.value||0)>0).map(p=>it(`${p.title} · ${p.size} · $${p.value}`)).join('')
                         : '<div class="muted">tidak ada</div>'}

    <h4>🔄 Screening Realtime</h4>
    <div class="item" id="scan-${v.venue}">🔄 …</div>
    <div class="item">event venue ini: ${((s.info||{}).counts||{})[v.venue]||0}
      · perbandingan: ${((s.info||{}).comparisons||0).toLocaleString('id-ID')}</div>
    <div class="logbox">${(s.scanlog||[]).filter(l=>l.includes(v.venue)).slice(-8)
      .map(l=>'<div>'+l+'</div>').join('') || '<div class="muted">…menunggu log…</div>'}</div>      

    <h4>Match + Π bersih (terbesar → terkecil)</h4>
    <div class="matchbox">
      ${(s.matches||[]).filter(m=>m.a===v.venue||m.b===v.venue)
        .map(m=>it('['+m.cat+'] '+m.a+' ↔ '+m.b+
          ' · kotor '+(m.gross*100).toFixed(1)+'¢ − fee '+(m.fees*100).toFixed(1)+
          '¢ = <b style="color:#86efac">Π '+(m.pi*100).toFixed(1)+'¢</b>'+
          '<br><span class="muted">'+m.ta+' ↔ '+m.tb+'</span>')).join('')
        || '<div class="muted">belum ada kejadian yang sama</div>'}
      ${(s.near||[]).filter(n=>n.a===v.venue||n.b===v.venue)
        .map(n=>it('<span class="muted">kandidat (sim '+n.s+'): '+n.ta+' ↔ '+n.tb+'</span>')).join('')}
    </div>

    <h4>Eksekusi</h4>
    <div style="max-height:240px;overflow-y:auto;min-height:80px;border:1px solid #1e293b;background:#0b1220;padding:6px;border-radius:6px">
    ${(s.trades||[]).filter(t=>t.venues.includes(v.venue))
      .map(t=>it(`${(t.ts||'').slice(11,19)} · ${t.mode} · Π=${(t.pi*100).toFixed(2)}¢ · $${t.size}`)).join('')
      || '<div class="muted">belum ada</div>'}
    </div>
  </div>`).join('');

<script>
function loadRecon(){
  fetch('/api/reconciliation').then(r=>r.json()).then(d=>{
    const el = document.getElementById('recon-content');
    const baseline = d.baseline.saldo || {};
    const ts = d.baseline.ts ? new Date(d.baseline.ts).toLocaleString('id-ID') : 'belum diset';
    
    let html = '<div style="font-size:13px;margin-bottom:12px">';
    html += '<strong>Baseline diset:</strong> ' + ts + '<br>';
    html += '<strong>Saldo baseline:</strong> ';
    if (baseline.polymarket || baseline.kalshi || baseline.limitless) {
      html += 'Poly $' + (baseline.polymarket||0).toFixed(2) + 
              ' · Kalshi $' + (baseline.kalshi||0).toFixed(2) + 
              ' · Limitless $' + (baseline.limitless||0).toFixed(2);
    } else {
      html += '<em>belum ada (klik tombol di bawah)</em>';
    }
    html += '</div>';
    
    html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px">';
    html += '<div style="padding:8px;background:#1e293b;border-radius:4px">';
    html += '<div style="font-size:11px;color:#64748b">Order Real (sejak baseline)</div>';
    html += '<div style="font-size:18px;font-weight:600">' + d.trades_real + '</div>';
    html += '</div>';
    html += '<div style="padding:8px;background:#1e293b;border-radius:4px">';
    html += '<div style="font-size:11px;color:#64748b">Order Paper (sejak baseline)</div>';
    html += '<div style="font-size:18px;font-weight:600">' + d.trades_paper + '</div>';
    html += '</div>';
    html += '<div style="padding:8px;background:#1e293b;border-radius:4px">';
    html += '<div style="font-size:11px;color:#64748b">Spend Hari Ini (hari ini)</div>';
    html += '<div style="font-size:18px;font-weight:600">$' + d.spend_today.toFixed(2) + '</div>';
    html += '</div></div>';
    
    if (Object.keys(d.by_venue).length > 0) {
      html += '<div style="margin-bottom:12px"><strong>Breakdown per Venue (sejak baseline):</strong><br>';
      for (const [v, data] of Object.entries(d.by_venue)) {
        html += '<span style="display:inline-block;margin-right:16px">' + v.toUpperCase() + 
                ': ' + data.count + ' order, $' + data.size.toFixed(2) + '</span>';
      }
      html += '</div>';
    }
    
    if (d.recent_trades.length > 0) {
      html += '<div><strong>10 Trade Terakhir (lintas hari, 10 terbaru):</strong><br>';
      d.recent_trades.slice().reverse().forEach(t => {
        html += '<div style="font-size:12px;margin:4px 0;color:#cbd5e1">' + 
                t.ts + ' [' + t.mode + '] ' + t.venues.join(',') + 
                ' Π=' + (t.pi*100).toFixed(1) + '¢ $' + t.size + '</div>';
      });
      html += '</div>';
    }
    
    el.innerHTML = html;
  }).catch(e => {
    document.getElementById('recon-content').innerHTML = 'Error: ' + e.message;
  });
}

function setBaseline(){
  if(!confirm('Simpan saldo sekarang sebagai baseline rekonsiliasi?')) return;
  fetch('/api/saldo').then(r=>r.json()).then(s=>{
    const baseline = {
      polymarket: s.polymarket?.web_usd || s.polymarket?.cash_usd || 0,
      kalshi: (s.kalshi?.cash_usd || 0) + (s.kalshi?.portfolio_usd || 0),
      limitless: s.limitless?.portfolio_usd || s.limitless?.usdc_base || 0
    };
    fetch('/api/baseline/set', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(baseline)
    }).then(r=>r.json()).then(d=>{
      alert(d.ok ? '✅ Baseline tersimpan' : '❌ ' + d.message);
      loadRecon();
    });
  });
}

loadRecon();
setInterval(loadRecon, 60000);  // refresh tiap menit
</script>

<script>
// Filter rekonsiliasi harian (default: hari ini)
(function(){
  const today = new Date().toISOString().slice(0,10);
  const fromEl = document.getElementById('rekFrom');
  const toEl = document.getElementById('rekTo');
  const filterEl = document.getElementById('rekFilter');
  const dlBtn = document.getElementById('rekDownload');
  const cntEl = document.getElementById('rekCount');
  if (fromEl) fromEl.value = today;
  if (toEl) toEl.value = today;

  function applyFilter(){
    const mode = filterEl.value;
    const now = new Date();
    let from = fromEl.value, to = toEl.value;
    if (mode === 'today'){ from = to = today; }
    else if (mode === 'week'){
      const d = new Date(now); d.setDate(d.getDate()-7);
      from = d.toISOString().slice(0,10); to = today;
    } else if (mode === 'month'){
      const d = new Date(now); d.setDate(d.getDate()-30);
      from = d.toISOString().slice(0,10); to = today;
    }
    if (fromEl) fromEl.value = from;
    if (toEl) toEl.value = to;
    // Filter baris EKSEKUSI berdasarkan tanggal (prefix YYYY-MM-DD)
    const rows = document.querySelectorAll('#execTable tr, [data-exec-row]');
    let shown = 0;
    rows.forEach(r => {
      const txt = r.innerText || '';
      const m = txt.match(/(\d{4}-\d{2}-\d{2})/);
      if (!m){ r.style.display = ''; return; }
      const d = m[1];
      if (from && d < from) r.style.display = 'none';
      else if (to && d > to) r.style.display = 'none';
      else { r.style.display = ''; shown++; }
    });
    if (cntEl) cntEl.textContent = shown + ' baris ditampilkan';
  }
  if (filterEl){
    filterEl.addEventListener('change', applyFilter);
    if (fromEl) fromEl.addEventListener('change', ()=>{ filterEl.value='all'; applyFilter(); });
    if (toEl) toEl.addEventListener('change', ()=>{ filterEl.value='all'; applyFilter(); });
    setTimeout(applyFilter, 500);
  }
  if (dlBtn){
    dlBtn.addEventListener('click', ()=>{
      const from = fromEl.value || '';
      const to = toEl.value || '';
      window.location.href = '/api/report.csv?from=' + from + '&to=' + to;
    });
  }
})();
</script>
