<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<title>Arb Bot Dashboard</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:24px}
.wrap{max-width:1140px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
h1{color:#38bdf8;margin:0;font-size:22px}
button{background:#059669;color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;margin-left:6px}
button.red{background:#dc2626}button.blue{background:#0ea5e9}button.gray{background:#334155}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.col{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:14px;min-height:320px}
.col h2{color:#38bdf8;margin:0 0 8px;font-size:15px}
h4{color:#7dd3fc;margin:12px 0 4px;font-size:11px;text-transform:uppercase}
.muted{color:#94a3b8;font-size:12px}
.item{font-size:12px;margin:3px 0;border-bottom:1px dashed #334155;padding-bottom:3px}
.badge{padding:4px 10px;border-radius:6px;font-weight:700}
.on{background:#059669}.off{background:#dc2626}
.tabs{margin:18px 0 8px}.tabs button{background:#334155}
iframe{width:100%;height:70vh;border:1px solid #334155;border-radius:12px;background:#0f172a}
a{color:#38bdf8}
</style></head>
<body><div class="wrap">
<header>
 <h1>🚀 Arb Bot Dashboard</h1>
 <div>
  <span id="badge" class="badge off">INACTIVE</span>
  <button onclick="start('paper')">▶ Mulai Paper</button>
  <button class="blue" onclick="start('real')">💰 Mulai Real</button>
  <button class="gray" onclick="stop()">⏹ Stop</button>
  <button class="red" onclick="kill()">🛑 Kill Switch</button>
  <button class="gray" onclick="location.href='/setup'">⚙️ Setup</button>
 </div>
</header>

<div class="cols" id="cols"></div>

<div class="tabs">
 <button onclick="tab(0)">📊 Dashboard</button>
 <button onclick="tab(1)">🧾 Audit</button>
</div>
<div id="audit" style="display:none"><iframe src="/legacy"></iframe></div>

<script>
const LINKS = {polymarket:"https://polymarket.com/portfolio",
               kalshi:"https://kalshi.com/portfolio",
               limitless:"https://limitless.exchange/portfolio"};
async function start(mode){
  if(mode==='real' && !confirm('Mode REAL = order asli dengan dana akun. Lanjut?')) return;
  const r = await fetch('/api/engine/start',{method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({mode})});
  const d = await r.json(); if(!d.ok) alert(d.message);
  poll();
}
async function stop(){ await fetch('/api/engine/stop',{method:'POST'}); poll(); }
async function kill(){ if(confirm('Kill switch: hentikan & kunci eksekusi?')){
  await fetch('/api/engine/kill',{method:'POST'}); poll(); } }
function tab(a){ document.getElementById('audit').style.display = a?'block':'none'; }
const it = s => `<div class="item">${s}</div>`;
async function poll(){
  const [f, s] = await Promise.all([
    fetch('/api/venue-feed').then(r=>r.json()),
    fetch('/api/engine/status').then(r=>r.json())]);
  const b = document.getElementById('badge');
  b.textContent = s.kill ? '🛑 KILLED' : (s.running ? 'ACTIVE · '+s.mode.toUpperCase() : 'INACTIVE');
  b.className = 'badge ' + (s.running && !s.kill ? 'on' : 'off');
  document.getElementById('cols').innerHTML = f.venues.map(v => `
  <div class="col">
    <h2>${v.venue.toUpperCase()} ${v.valid?'✅':'⚠️'} ·
      <a target="_blank" href="${LINKS[v.venue]}">buka exchange ↗</a></h2>
    <div class="muted">Menu: ${(v.cats||[]).join(', ')||'-'}</div>
    <h4>Open Positions (OP)</h4>
    ${v.positions.length ? v.positions.map(p=>it(`${p.title} · ${p.size} · $${p.value}`)).join('')
                         : '<div class="muted">tidak ada</div>'}
    <h4>Match + Π</h4>
    ${(s.matches||[]).filter(m=>m.a===v.venue||m.b===v.venue)
      .map(m=>it(`[${m.cat}] Π=${(m.pi*100).toFixed(2)}¢ <span class="muted">${m.a}↔${m.b}</span>`)).join('')
      || '<div class="muted">menunggu scanner…</div>'}
    <h4>Eksekusi</h4>
    ${(s.trades||[]).filter(t=>t.venues.includes(v.venue))
      .map(t=>it(`${(t.ts||'').slice(11,19)} · ${t.mode} · Π=${(t.pi*100).toFixed(2)}¢ · $${t.size}`)).join('')
      || '<div class="muted">belum ada</div>'}
  </div>`).join('');
}
poll(); setInterval(poll, 10000);
</script>
</div></body></html>
